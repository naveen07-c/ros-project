# Controller configuration for the bipedal robot (M5).
#
# controller_manager: 100 Hz (matches the world max_step_size of 0.001 s =
# 1 kHz physics; the CM decimates but stays in phase with sim time).
# ASSUMPTION (PROJECT_REQUIREMENTS §12): gains are starting points, to be
# tuned during gait milestones.
#
# The JTC runs in KEEP_LOCAL_TRAJECTORY state-hold mode: after a goal
# completes (e.g. the stand_hold node's hold pose), the last commanded
# position is held indefinitely - this is what keeps the robot standing
# with payload after the crouch-in transition finishes.

controller_manager:
  ros__parameters:
    # M8: 500 Hz (was 100). Physics runs at 1 kHz; at 100 Hz the torque
    # hold between updates could not damp the contact-excited hop and the
    # robot bounced in place (IMU: |a| 9->11 m/s^2, contact forces
    # oscillating 0 <-> 300 N). 500 Hz gives 2 ms torque refresh.
    update_rate: 500  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    # Publish all state interfaces (position/velocity/effort) at update_rate.
    use_local_topics: false

joint_trajectory_controller:
  ros__parameters:
    joints:
      - left_hip_roll
      - left_hip_pitch
      - left_knee
      - left_ankle_pitch
      - left_ankle_roll
      - right_hip_roll
      - right_hip_pitch
      - right_knee
      - right_ankle_pitch
      - right_ankle_roll

    # M8: effort command interface - the JTC computes torques with the
    # per-joint PID gains below. Position-interface realization in
    # gz_ros2_control is a velocity law (kp * error) that either sagged
    # (kp=1) or injected explosive energy (kp=8/60) under single-support
    # body load; true torque control is the standard for legged robots.
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity

    # Per-joint PID (close_loop controller update). Gains ASSUMPTION
    # (PROJECT_REQUIREMENTS §12), tuned for the M8 gait in simulation:
    # stiffness sized against single-support gravity loads (~15-20 N*m
    # at hip/knee), damping ~ 2*zeta*sqrt(kp*I) with the leg inertia.
    # Gravity compensation is open-loop scripted via the gait poses
    # (no feedforward gravity term available in stock JTC).
    # M8 tuning iteration 2: the integrator caused pogo-stick bouncing
    # once a MOVING reference was tracked (sustained ramp error -> windup
    # up to the clamp -> overshoot -> contact bounce limit cycle; stand
    # hold was perfectly calm, proving the windup diagnosis). i=0:
    # gravity is handled by the open-loop scripted poses.
    # Gait-retune iteration 3 (AT-06/AT-11): with p=120 the ~8 N*m
    # single-support knee gravity torque produced ~0.07 rad of tracking
    # sag every step - the support leg pumped at the step frequency
    # (IMU az 0.4 <-> 8.4 m/s^2, contact forces chopping 0 <-> 185 N,
    # flight phases every cycle). Torque-law PD is stable at high p
    # (unlike the old velocity realization); zeta = d/(2*sqrt(p*I))
    # stays >= 0.9 for the leg inertias, so these gains are overdamped.
    # Gait-retune iteration 4: p=320 (iter 3) saturated the 40 N*m
    # effort limit on every transient (0.125 rad error = 40 N*m) -
    # bang-bang torques agitated even the crouch ramp. Back to the
    # M8-proven p=100-120 (stable at stand, under the limit) now that
    # the gait geometry carries the balance (d1 height + overshoot):
    # tracking sag ~0.07 rad is tolerated by the 0.2 rad trajectory
    # constraint and bounded by the gait's static margin.
    # Gait-retune iteration 6: gz pose ground truth showed the crouch
    # rings the BODY pitch mode (+/-6 deg, ~1.5 Hz inverted pendulum on
    # the soft soles) and saturates to a face-plant ~1 s after the
    # crouch completes. Rigid-body rocking about the foot edge moves
    # only the ANKLE joints, so the ankle PD is the only actuator that
    # sees this mode - raised p/d there (zeta 0.16 -> ~0.4). Sole
    # contact kd 100 -> 400 adds rocking damping through the foot-edge
    # lever (joint d-gains are blind to this mode by construction).
    # Gait-retune iteration 7: iteration 6 REGRESSED - higher ankle
    # stiffness + kd=400 sole turned the crouch into a hop (feet unload
    # 0 N mid-crouch, |a| to 50). REVERTED to the AT-05-verified gains
    # (ankle p=100 d=10, sole kd=100; az=9.81 std=0.00 was measured on
    # exactly these). The failing variable is instead the POSE: the
    # verified 15 deg stand is stable while the 30 deg gait crouch is
    # not - gait crouch now defaults to 20 deg (walk.launch.py), the
    # deepest feasible crouch near the proven pose.
    # Gait-retune iteration 9: isolation test - stand_hold at crouch
    # 20 deg bounces (az -39..+27 m/s^2 while the knee holds 40.0 deg)
    # while the 15 deg stand is bit-perfect calm: the crouch depth
    # crosses a stability boundary. The self-sustained mode is the
    # rigid BODY rocking/bouncing on the soft soles: it acts on the
    # body inertia about the foot edge (~3 kg*m^2, not the leg
    # inertia), so the pitch-chain joint damping d=10 is underdamped
    # there (zeta ~ 0.3).
    # Gait-retune iteration 10: d=30 on the pitch chain REGRESSED -
    # the damping torque opposes the crouch RAMP itself (0.3 rad/s x
    # 30 = 9 N*m), the knees lag the trajectory by exactly the 0.25
    # tolerance (joints 2/7: 0.2508) and every goal aborts mid-ramp
    # (re-ramp thrash). REVERTED to d=10; the 20 deg bounce is
    # attacked via the sole contact and crouch depth instead.
    # Gait-retune iteration 12: NO ODE PHYSICS PLUGIN IS INSTALLED -
    # gz-sim runs DART (dartsim-plugin is the only joint-capable engine
    # here besides bullet). ODE surface tags are interpreted by the
    # dartsim plugin loosely at best; stop treating ERP formulas as
    # ground truth. The instability is the STIFF SERVO pumping energy
    # into contact impacts (25 Hz signature, az mean > g, spikes +17g
    # while joints hold perfectly): soften the servo instead. Quasi-
    # static walking needs torque capacity for the ~8-15 N*m single-
    # support gravity loads, which p=60 delivers with ~0.15-0.25 rad
    # of tolerated sag (inside the 0.25 trajectory / 0.12+ goal
    # tolerances); d scaled with sqrt(p).
    # Gait-retune iteration 13: iteration 12's ankle p=40 sits BELOW
    # the single-support inverted-pendulum gradient m*g*h ~= 48.6 N*m/rad
    # (9 kg, h=0.55 m): the ankle pair cannot hold the body attitude in
    # SS at any error - a persistent ~4 deg pelvis lean is the servo
    # compliance equilibrium. Ankle p=80 now exceeds the gradient; hips
    # and knees stay at 60. Plus two gait-generator mechanisms (see
    # gait_generator.cpp): swing-sole levelling from the pelvis IMU and
    # a per-segment iterative-learning feedforward for the servo sag.
    # Gait-retune iteration 15: iteration 13 (ankle p=80 > gradient
    # 48.6) re-armed the stiff-servo/contact pump - az swings +/-25 with
    # 0 N flight phases within one step. The ANKLE is the wrong actuator
    # for SS attitude anyway: it couples directly into the contact. The
    # HIP PITCH pair (p=60 > 48.6 N*m/rad) can hold the attitude and is
    # contact-decoupled; attitude feedback now runs through the hips in
    # the gait generator (command sum = -pelvis_pitch). Ankles back to
    # the calm-verified 60/6; swing-sole levelling + ILC sag feedforward
    # stay (gait_generator.cpp).
    # Gait-retune iteration 16: A/B isolation - with hips/knees 60/6
    # and BOTH new generator mechanisms off, ankle 60/6 diverges at the
    # first weight shift while the iteration-12 ankle 40/4 walked
    # upright indefinitely (az 9.5-10.1 for 50 s). The stance-ankle
    # stiffness is the SS attitude equilibrium knob; 40/4 it is.
    # Gait-retune iteration 20: hip 120 (iter 19) = instant contact
    # chaos (az +/-85) - REVERTED to 60. Same for knee 120. The hip
    # 60 sag (~0.13 rad under load) leaves the pelvis behind the
    # commanded pose; the feet slide instead of the body advancing.
    # The generator-side remedies (ILC feedforward with freeze, swing
    # sole levelling) both measured destabilizing in the A/B campaign
    # (runs D-H), so the sag is tolerated and progress is attempted
    # through SOLE GRIP: mu 1.0 -> 4.0 in leg.xacro (iter 19).
    gains:
      left_hip_roll:       {p: 60.0, i: 0.0, d: 15.0}
      left_hip_pitch:      {p: 80.0, i: 0.0, d: 6.0}
      left_knee:           {p: 60.0, i: 0.0, d: 6.0}
      left_ankle_pitch:    {p: 40.0, i: 0.0, d: 4.0}
      left_ankle_roll:     {p: 40.0, i: 0.0, d: 10.0}
      right_hip_roll:      {p: 60.0, i: 0.0, d: 15.0}
      right_hip_pitch:     {p: 80.0, i: 0.0, d: 6.0}
      right_knee:          {p: 60.0, i: 0.0, d: 6.0}
      right_ankle_pitch:   {p: 40.0, i: 0.0, d: 4.0}
      right_ankle_roll:    {p: 40.0, i: 0.0, d: 10.0}

    # Symmetric interpolation limits. Active while a trajectory goal is
    # executing (crouch-in, later gait steps).
    # Gait-retune iteration 3: 0.05 rad trajectory tolerance aborted
    # goals ~200 ms in (Position Error 0.0509 > 0.05) whenever the
    # initial ramp transient outpaced the contact-loaded joints -
    # random startup ESTOPs. 0.2 rad still catches real failures (a
    # collapsed/fallen leg runs to > 0.5 rad) while tolerating the
    # transient; the IMU probe + segment watchdog are the fall guards.
    # Gait-retune iteration 5: the GOAL tolerance must exceed the
    # achievable single-support steady-state tracking sag (~0.07 rad
    # at p=120 under ~8 N*m load) - at 0.06 rad, SS-ending segments
    # could never converge and the goal hung until the watchdog fired.
    # Gait-retune iteration 12: with the soft servo (p=60), the SS
    # support-knee steady-state sag is ~8/60 = 0.133 rad - above the
    # old 0.12 goal tolerance the SS goal could never converge and the
    # watchdog froze the gait at the first weight shift (forces froze
    # at 51.5/30.9 N with az rock-steady 9.75). 0.2 still separates
    # real falls (0.5+) from servo sag; the trajectory constraint
    # (0.3) covers the SS transient on top of the sag.
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0   # 0 = disabled: no hard goal-time abort
      left_hip_roll:
        trajectory: 0.30
        goal: 0.20
      left_hip_pitch:
        trajectory: 0.30
        goal: 0.20
      left_knee:
        trajectory: 0.30
        goal: 0.20
      left_ankle_pitch:
        trajectory: 0.30
        goal: 0.20
      left_ankle_roll:
        trajectory: 0.30
        goal: 0.20
      right_hip_roll:
        trajectory: 0.30
        goal: 0.20
      right_hip_pitch:
        trajectory: 0.30
        goal: 0.20
      right_knee:
        trajectory: 0.30
        goal: 0.20
      right_ankle_pitch:
        trajectory: 0.30
        goal: 0.20
      right_ankle_roll:
        trajectory: 0.30
        goal: 0.20

    # Effort-mode JTC computes commands from position error with velocity
    # feedforward via the gains above.
    allow_partial_joints_goal: false
    open_loop_control: false
