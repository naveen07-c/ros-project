# Controller configuration for the Tier S hardware biped (M12,
# HARDWARE_SELECTION.md §7). Companion to biped_controllers.yaml (sim).
#
# Differences vs the sim file (everything else identical):
#   - update_rate 100 Hz: the real loop is bounded by the 50 Hz PWM frame
#     (ESP32/PCA9685); 100 Hz gives the JTC two cycles per frame without
#     demanding impossible serial bandwidth.
#   - JTC runs in POSITION command mode: the DS3218's internal servo loop
#     IS the plant. The sim's effort-mode per-joint PID has no analog on
#     PWM servos (no torque feedback — documented accepted loss, §7.3);
#     the gains block is retained only because JTC requires the field,
#     its values are unused in position mode.
#   - Gait-side sag compensations (settle_boost, sag-aware tolerances)
#     transfer unchanged; the effort-abort machinery degrades to
#     position-error aborts automatically.

controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    use_local_topics: false

joint_trajectory_controller:
  ros__parameters:
    joints:
      - left_hip_roll
      - left_hip_pitch
      - left_knee
      - left_ankle_pitch
      - left_ankle_roll
      - right_hip_roll
      - right_hip_pitch
      - right_knee
      - right_ankle_pitch
      - right_ankle_roll

    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

    # Unused in position mode (servo loop is internal); kept for schema
    # compatibility with the sim config.
    gains:
      left_hip_roll:       {p: 1.0, i: 0.0, d: 0.0}
      left_hip_pitch:      {p: 1.0, i: 0.0, d: 0.0}
      left_knee:           {p: 1.0, i: 0.0, d: 0.0}
      left_ankle_pitch:    {p: 1.0, i: 0.0, d: 0.0}
      left_ankle_roll:     {p: 1.0, i: 0.0, d: 0.0}
      right_hip_roll:      {p: 1.0, i: 0.0, d: 0.0}
      right_hip_pitch:     {p: 1.0, i: 0.0, d: 0.0}
      right_knee:          {p: 1.0, i: 0.0, d: 0.0}
      right_ankle_pitch:   {p: 1.0, i: 0.0, d: 0.0}
      right_ankle_roll:    {p: 1.0, i: 0.0, d: 0.0}

    # Same sag-aware tolerances as the sim (AT-11): PWM servo sag under
    # load is expected to be comparable to the sim's 0.13 rad finding.
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0
      left_hip_roll:
        trajectory: 0.30
        goal: 0.20
      left_hip_pitch:
        trajectory: 0.30
        goal: 0.20
      left_knee:
        trajectory: 0.30
        goal: 0.20
      left_ankle_pitch:
        trajectory: 0.30
        goal: 0.20
      left_ankle_roll:
        trajectory: 0.30
        goal: 0.20
      right_hip_roll:
        trajectory: 0.30
        goal: 0.20
      right_hip_pitch:
        trajectory: 0.30
        goal: 0.20
      right_knee:
        trajectory: 0.30
        goal: 0.20
      right_ankle_pitch:
        trajectory: 0.30
        goal: 0.20
      right_ankle_roll:
        trajectory: 0.30
        goal: 0.20

    allow_partial_joints_goal: false
    open_loop_control: false
