controller_manager:
  ros__parameters:
    update_rate: 200  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    leg_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    joints:
      - left_hip_roll
      - right_hip_roll
      - left_hip_pitch
      - right_hip_pitch
      - left_knee_pitch
      - right_knee_pitch
      - left_ankle_pitch
      - right_ankle_pitch
      - left_ankle_roll
      - right_ankle_roll

leg_controller:
  ros__parameters:
    joints:
      - left_hip_roll
      - right_hip_roll
      - left_hip_pitch
      - right_hip_pitch
      - left_knee_pitch
      - right_knee_pitch
      - left_ankle_pitch
      - right_ankle_pitch
      - left_ankle_roll
      - right_ankle_roll
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: false
    allow_partial_joints_hw_goal: false
    open_loop_control: true
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
