# Walking gait parameters for the ZMP-preview biped controller.
#
# The CoM trajectory is generated by preview control of the Zero Moment Point
# (Kajita 2003) so that the induced ZMP stays inside the support foot and the
# robot is dynamically balanced.  Feet alternate sides; the reference ZMP is
# held on the stance foot during single support and ramps to the next foot
# during double support.  An attitude (roll) stabiliser (kp_roll/kd_roll with
# roll_sign=-1) and an optional capture-point (DCM) term (kdcm) add robustness.
gait_controller:
  ros__parameters:
    walk_enable: true
    base_height: 0.64      # pelvis height / CoM height z_c (m)
    speed: 0.10            # forward speed (m/s)
    step_time: 1.00        # duration of one step / half cycle (s)
    ds_frac: 0.30          # fraction of the step in double support
    step_width: 0.09       # lateral distance of each foot from the centre (m)
    foot_lift: 0.04        # swing foot clearance (m)
    stand_time: 2.0        # seconds standing before walking starts
    prep_time: 1.0         # CoM pre-shift onto the stance foot before stepping
    publish_rate: 100.0    # trajectory commands per second (Hz)
    preview_time: 1.6      # ZMP preview horizon (s)
    qe: 1.0                # ZMP tracking weight (LQR Q)
    preview_r: 1.0e-6      # jerk weight (LQR R)
    servo: false           # closed-loop (servo) preview control (experimental)
    att_fb: true           # attitude (roll/pitch) stabiliser
    kp_roll: 0.25
    kd_roll: 0.05
    roll_sign: -1.0
    kp_pitch: 0.0
    kd_pitch: 0.0
    pitch_sign: -1.0
    kdcm: 0.0              # capture-point (DCM) feedback gain
    stand_com_x: 0.0
    stand_com_y: 0.0
    slope_follow: true     # adapt gait to a sloping ground plane (ramps)
    terrain_x: ''          # ground breakpoints, comma-sep (empty = flat ground)
    terrain_z: ''          # matching heights (m), e.g. "0,2.5,4.47,8"
    ankle_slope_sign: -1.0  # sign that flattens the sole against the slope
    slope_zmp_gain: 0.0    # uphill CoM lean scale (1.0 = z_c*sin(alpha))
    slope_speed_factor: 0.35  # stride scale on an uphill ramp
    slope_down_factor: 0.35    # stride scale on a downhill (>=1 keeps feet ahead)
    slope_speed_thresh: 0.005  # |slope| above which the stride is shortened
    slope_roll_kp: 0.0     # extra roll P gain scaled by local slope
    slope_roll_kd: 0.0     # extra roll D gain scaled by local slope
    slope_roll_cut: 0.0    # fade the base kp_roll out on genuine ramps
    slope_kdcm: 0.0        # slope-gated downhill DCM brake gain
    step_adj: 0.0          # DCM footstep-adjust gain (capture-point stepping)
    step_adj_max: 0.03     # clamp on step adjustment (m)
    roll_direct_kp: 0.0    # direct hip-roll feedback gain (fast lateral balance)
    roll_direct_kd: 0.0    # direct hip-roll rate damping
    payload_mass: 1.0      # kg carried on top of the pelvis (0 = no payload)
    payload_x: 0.0         # payload CoM position in the base frame (m)
    payload_y: 0.0
    payload_z: 0.05
    body_mass: 6.3         # robot mass without the payload (kg)
    body_com_height: 0.464  # body CoM height above ground at nominal stance
    edge_stop: true         # fall-safe: halt before a drop-off / edge
    edge_lookahead: 0.30    # probe distance ahead of the base (m)
    edge_drop: 0.15         # down-step size that triggers a stop (m)
